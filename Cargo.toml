[package]
name = "moonlighter_overlay"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
image = "0.25.10"
rayon = "1.12.0"
softbuffer = "0.4.8"
xcap = "0.9.7"
rust-embed = { version = "8.12.0", features = ["include-exclude"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9.8"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Console",
] }
winit = { version = "0.30.13", default-features = false, features = [
    "serde",
    "rwh_06",
] }
font-loader = "0.11.0"
ab_glyph = "0.2.32"
egui = "0.35"
egui-winit = "0.35"
regex = "1.13.1"
